[project]
name = "nesweep-zeta-server"
version = "0.1.0"
description = "Standalone MLX source-verification server for Zeta 2.1"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mlx-lm==0.32.2",
  "grpcio==1.84.1",
  "protobuf==7.36.2",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[dependency-groups]
codegen = ["grpcio-tools==1.84.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
