supportedArchitectures:
  - darwin-arm64
python:
  enabled: true
  versions: ["3.13"]
  groups: [codegen]
packages:
  - extension
  - server

allowBuilds:
  "@vscode/vsce-sign": false
  keytar: false
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
