
# BEGIN s-obvious-dev-plugins mcp_servers.serena
[mcp_servers.serena]
command = "node"
startup_timeout_sec = 60
args = ["-e","const p=require('node:path');const h=require('node:os').homedir();import(require('node:url').pathToFileURL(p.join(h,'.local','share','s-obvious-dev-plugins','mcp-runtime','scripts','mcp-launch.mjs')).href).catch(e=>{console.error(e.message+'. Run the plugin bootstrap or global update command to install the shared runtime.');process.exitCode=1})","mcp-launch","serena"]
# END s-obvious-dev-plugins mcp_servers.serena

